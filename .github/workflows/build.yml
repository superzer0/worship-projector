name: Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release version derivation
        run: ./scripts/test-release-version.sh

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 14

      - name: Prepare runtime dependencies
        run: ./mvnw --batch-mode --no-transfer-progress dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb xdotool libxi6 libxrender1 libxtst6

      - name: Verify displayable theme refresh
        run: xvfb-run -a ./mvnw --batch-mode --no-transfer-progress -Dtest=UiThemeDisplayTest test

      - name: Smoke-test light-theme startup
        run: ./scripts/smoke-test.sh

      - name: Smoke-test dark-theme startup
        env:
          JWORSHIP_THEME: dark
        run: ./scripts/smoke-test.sh

      - name: Smoke-test HiDPI startup
        env:
          JAVA_TOOL_OPTIONS: -Dsun.java2d.uiScale=2
        run: ./scripts/smoke-test.sh

      - name: Build self-contained Linux application
        run: ./scripts/package-app.sh 1.0.0 linux x64

      - name: Smoke-test the downloadable archive
        run: |
          mkdir -p target/package-smoke
          tar -xzf dist/jWorship-1.0.0-linux-x64.tar.gz -C target/package-smoke
          ./scripts/smoke-test-package.sh target/package-smoke/jWorship/bin/jWorship
