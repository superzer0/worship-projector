name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out the master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive the release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != 'master' ]]; then
            echo "Automatic releases must run from master" >&2
            exit 1
          fi
          version="0.1.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and prepare dependencies
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency

      - name: Test and prepare dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency

      - name: Create Linux or macOS application image
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: ./scripts/package-app.sh "$RELEASE_VERSION" "$RELEASE_PLATFORM" "$RELEASE_ARCH"

      - name: Create Windows application image
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: .\scripts\package-app.ps1 -Version $env:RELEASE_VERSION -Architecture x64

      - name: Install Linux smoke-test dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb xdotool libxi6 libxrender1 libxtst6

      - name: Smoke-test Linux release archive
        if: matrix.platform == 'linux'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p target/release-smoke-linux
          tar -xzf "dist/jWorship-${RELEASE_VERSION}-linux-${RELEASE_ARCH}.tar.gz" -C target/release-smoke-linux
          ./scripts/smoke-test-package.sh target/release-smoke-linux/jWorship/bin/jWorship

      - name: Smoke-test macOS release archive
        if: matrix.platform == 'macos'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: ./scripts/smoke-test-package-macos.sh "dist/jWorship-${RELEASE_VERSION}-macos-${RELEASE_ARCH}.zip"

      - name: Smoke-test Windows release archive
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: .\scripts\smoke-test-package.ps1 -Archive "dist/jWorship-$env:RELEASE_VERSION-windows-x64.zip"

      - name: Upload packaged application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify artifact checksums
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>tag-error.log); then
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to a different commit" >&2
              exit 1
            fi
          elif grep -q '(HTTP 404)' tag-error.log; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA"
          else
            cat tag-error.log >&2
            exit 1
          fi

      - name: Verify the remote tag still points to this build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          while [[ "$object_type" == 'tag' ]]; do
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<<"$tag_object")
            object_sha=$(jq -r '.object.sha' <<<"$tag_object")
          done
          if [[ "$object_type" != 'commit' || "$object_sha" != "$RELEASE_SHA" ]]; then
            echo "The remote tag no longer points to the commit that produced these artifacts" >&2
            exit 1
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>release-error.log; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --title "jWorship $RELEASE_VERSION"
          elif grep -Fxq 'release not found' release-error.log; then
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "jWorship $RELEASE_VERSION"
          else
            cat release-error.log >&2
            exit 1
          fi
