name: Build

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Prepare runtime dependencies
        run: ./mvnw --batch-mode --no-transfer-progress dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb xdotool libxi6 libxrender1 libxtst6

      - name: Smoke-test Swing startup
        run: ./scripts/smoke-test.sh

      - name: Build self-contained Linux application
        run: ./scripts/package-app.sh 0.0.0 linux x64

      - name: Smoke-test the downloadable archive
        run: |
          mkdir -p target/package-smoke
          tar -xzf dist/jWorship-0.0.0-linux-x64.tar.gz -C target/package-smoke
          ./scripts/smoke-test-package.sh target/package-smoke/jWorship/bin/jWorship
